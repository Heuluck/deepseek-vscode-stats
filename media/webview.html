<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek 余额</title>
  <link rel="stylesheet" href="{{CODICON_CSS_URI}}" />
  <link rel="stylesheet" href="{{CSS_URI}}" />
</head>
<body>
  <div id="app">
    <header>
      <div class="head-left">
      <div class="stats">
        <div class="stat">
          <span class="stat-label">当前余额</span>
          <span class="stat-value" id="curTotal">--</span>
        </div>
        <div class="stat" id="spendStat" hidden>
          <span class="stat-label">今日花费</span>
          <span class="stat-value" id="spendTotal">--</span>
        </div>
      </div>
      <div class="current-meta">
        <span class="meta" id="curMeta"></span>
        <span class="status" id="curStatus"></span>
      </div>
      </div>
      <div class="controls">
        <div class="ranges" id="ranges"></div>
        <div class="tabs" id="tabs"></div>
        <button class="btn" id="resetBtn" title="重置视图范围">重置</button>
        <button class="icon" id="refreshBtn" title="立即查询余额"><i class="codicon codicon-refresh"></i></button>
        <button class="icon" id="usageBtn" title="在浏览器打开 DeepSeek 用量页"><i class="codicon codicon-link-external"></i></button>
      </div>
    </header>
    <main id="chartWrap">
      <svg id="chart" width="0" height="0"></svg>
      <div id="tooltip" class="tooltip hidden"></div>
      <div id="empty" class="empty hidden">
        <div class="empty-icon"><i class="codicon codicon-graph-line"></i></div>
        <div class="empty-text" id="emptyText">暂无数据</div>
        <button class="btn primary" id="emptyAction" style="display:none">设置 API Key</button>
      </div>
    </main>
    <footer>
      <span id="footerInfo"></span>
      <span class="footer-right">
        <span class="err" id="footerErr"></span>
        <button class="btn" id="settingsBtn" title="设置"><i class="codicon codicon-gear"></i>设置</button>
      </span>
    </footer>
    <div id="settingsOverlay" class="overlay hidden">
      <div class="settings-panel">
        <div class="settings-head">
          <span class="settings-title">DeepSeek Stats 设置</span>
          <button class="icon" id="settingsClose" title="关闭"><i class="codicon codicon-close"></i></button>
        </div>
        <div class="settings-body">
          <div class="settings-group">
            <div class="settings-label">状态栏</div>
            <label class="settings-row">
              <span>显示余额</span>
              <input type="checkbox" id="showStatusBar" />
            </label>
            <button class="settings-toggle" id="colorToggle" type="button">
              <span>阈值颜色</span>
              <i class="codicon codicon-chevron-down"></i>
            </button>
            <div class="settings-collapse" id="colorCollapse">
              <div class="settings-row">
                <span>默认颜色</span>
                <div class="settings-controls">
                  <input type="color" id="defaultColor" />
                  <label class="settings-inline"><input type="checkbox" id="defaultColorTheme" />跟随主题</label>
                </div>
              </div>
              <div class="threshold-head">
                <span>余额阈值（低于 → 颜色）</span>
                <button class="btn small" id="addThresholdBtn"><i class="codicon codicon-add"></i>添加</button>
              </div>
              <div id="thresholdList"></div>
              <p class="settings-hint">余额低于阈值（不含）时状态栏使用对应颜色，按顺序匹配第一条。</p>
            </div>
          </div>

          <div class="settings-group">
            <div class="settings-label">常规</div>
            <div class="settings-row">
              <label for="pollMinutesEl">查询间隔（分钟）</label>
              <input type="number" id="pollMinutesEl" min="1" step="1" class="settings-number" />
            </div>
            <div class="settings-row">
              <label for="rawRetentionEl">分钟级快照保留（天）</label>
              <input type="number" id="rawRetentionEl" min="1" step="1" class="settings-number" />
            </div>
            <label class="settings-row">
              <span>显示今日花费（估算）</span>
              <input type="checkbox" id="showTodaySpend" />
            </label>
            <div id="spendConsent" class="settings-consent hidden">
              <p class="settings-hint">今日花费为根据余额快照推算的估算值，可能因充值或数据断档而不准确。</p>
              <div class="row">
                <button class="btn primary" id="spendConsentOk">同意启用</button>
                <button class="btn" id="spendConsentCancel">取消</button>
              </div>
            </div>
          </div>

          <div class="settings-group">
            <div class="settings-label">API Key</div>
            <div class="settings-row">
              <span id="keyStatus">未配置</span>
              <div class="settings-controls">
                <button class="btn" id="setKeyBtn">设置 / 更换</button>
                <button class="btn danger" id="clearKeyBtn">清除</button>
              </div>
            </div>
          </div>

          <div class="settings-group">
            <div class="settings-label">数据</div>
            <div class="settings-row">
              <span>历史快照（仅 VS Code 打开期间记录）</span>
              <button class="btn danger" id="clearHistoryBtn">清除历史</button>
            </div>
          </div>

          <div class="settings-group">
            <div class="settings-label">其他</div>
            <div class="settings-row">
              <span>恢复默认设置</span>
              <button class="btn danger" id="resetSettingsBtn">恢复默认</button>
            </div>
          </div>
        </div>
        <div class="settings-foot">
          <button class="btn" id="openNativeSettingsBtn"><i class="codicon codicon-settings-gear"></i>打开 VS Code 设置</button>
          <button class="btn" id="settingsCancel">取消</button>
          <button class="btn primary" id="settingsSave"><i class="codicon codicon-check"></i>保存</button>
        </div>
      </div>
    </div>
  </div>
  <script nonce="{{NONCE}}" src="{{JS_URI}}"></script>
</body>
</html>
